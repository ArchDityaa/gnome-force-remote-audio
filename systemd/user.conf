# Managed by gnome-force-remote-audio.
#
# Inject the audio shim into the per-user GNOME Remote Desktop service
# ("Desktop Sharing"), so audio output redirection is not disabled for
# Android/iOS RDP clients.
#
# This file is a template: install.sh replaces @LIBDIR@ with the real path.
[Service]
Environment=LD_PRELOAD=@LIBDIR@/libgrd-audio-fix.so
